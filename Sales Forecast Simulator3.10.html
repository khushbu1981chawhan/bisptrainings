<p>

Formula

<b>

Ft = α × Previous Actual + (1-α) × Previous Forecast

</b>

</p>

<script>

let forecast=[];

function calculate(){

let alpha=parseFloat(document.getElementById("alpha").value);

let actual=[];

for(let i=0;i<12;i++)
actual.push(Number(document.getElementById("m"+i).value));

forecast=[];

forecast[0]=actual[0];

for(let i=1;i<12;i++){

forecast[i]=alpha*actual[i-1]+(1-alpha)*forecast[i-1];

}

document.getElementById("forecast").innerHTML=

forecast.map(v=>v.toFixed(2)).join(" | ");

drawChart(actual,forecast);

}

function drawChart(actual,forecast){

let c=document.getElementById("chart");

let ctx=c.getContext("2d");

ctx.clearRect(0,0,c.width,c.height);

let max=Math.max(...actual)+5;

let min=Math.min(...actual)-5;

let w=70;

ctx.beginPath();

for(let i=0;i<12;i++){

let x=40+i*w;

let y=300-((actual[i]-min)/(max-min))*250;

if(i==0) ctx.moveTo(x,y);

else ctx.lineTo(x,y);

ctx.fillText(i+1,x-3,320);

}

ctx.stroke();

ctx.beginPath();

ctx.setLineDash([5,5]);

for(let i=0;i<12;i++){

let x=40+i*w;

let y=300-((forecast[i]-min)/(max-min))*250;

if(i==0) ctx.moveTo(x,y);

else ctx.lineTo(x,y);

}

ctx.stroke();

ctx.setLineDash([]);

}

function showCalculation(){

let alpha=document.getElementById("alpha").value;

let txt="";

for(let i=1;i<12;i++){

let a=document.getElementById("m"+(i-1)).value;

txt+="Month "+(i+1)+

" = ("+alpha+" × "+a+") + ("+

(1-alpha).toFixed(2)+" × Previous Forecast)<br>";

}

document.getElementById("calc").innerHTML=txt;

}

function showEssbase(){

document.getElementById("ess").innerText=

`FIX("Forecast")

IF(@ISMBR("Jan"))

Forecast=Actual;

ELSE

Forecast=

(Alpha*@PRIOR(Actual))

+

((1-Alpha)*@PRIOR(Forecast));

ENDIF

ENDFIX`;

}

function exportCSV(){

let csv="Month,Sales,Forecast\n";

let months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

for(let i=0;i<12;i++){

csv+=months[i]+","+

document.getElementById("m"+i).value+","+

(forecast[i]||"")+"\n";

}

let a=document.createElement("a");

a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);

a.download="Forecast.csv";

a.click();

}

</script>
