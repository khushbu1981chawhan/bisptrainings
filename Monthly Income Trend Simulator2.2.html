<script>

function values(){

let arr=[];

document.querySelectorAll("input").forEach(i=>{

arr.push(Number(i.value));

});

return arr;

}

function calculate(){

let a=values();

let total=a.reduce((x,y)=>x+y,0);

let avg=(total/a.length).toFixed(2);

let max=Math.max(...a);

let min=Math.min(...a);

let html="";

html+="<h3>Result</h3>";

html+="Total Income : "+total+"<br>";

html+="Average Income : "+avg+"<br>";

html+="Highest Income : "+max+"<br>";

html+="Lowest Income : "+min;

let d=document.getElementById("result");

d.style.display="block";

d.innerHTML=html;

}

function showCalc(){

let a=values();

let txt="Monthly Income Calculation\n\n";

let months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let total=0;

for(let i=0;i<12;i++){

txt+=months[i]+" = "+a[i]+"\n";

total+=a[i];

}

txt+="\nTotal = "+total;

txt+="\nAverage = "+(total/12).toFixed(2);

let d=document.getElementById("formula");

d.style.display="block";

d.innerText=txt;

}

function showEssbase(){

let txt=`FIX("Actual","FY26","Income")

"Total Income"=

Jan+Feb+Mar+Apr+May+Jun+

Jul+Aug+Sep+Oct+Nov+Dec;

"Average Income"="Total Income"/12;

ENDFIX`;

let d=document.getElementById("essbase");

d.style.display="block";

d.innerText=txt;

}

function exportCSV(){

let a=values();

let months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let csv="Month,Income\n";

for(let i=0;i<12;i++){

csv+=months[i]+","+a[i]+"\n";

}

let blob=new Blob([csv],{type:"text/csv"});

let url=URL.createObjectURL(blob);

let x=document.createElement("a");

x.href=url;

x.download="MonthlyIncome.csv";

x.click();

}

</script>
