<script>

function values(){

let arr=[];

document.querySelectorAll("input").forEach(function(x){

arr.push(Number(x.value));

});

return arr;

}

function calculate(){

let a=values();

let total=a.reduce((x,y)=>x+y,0);

let avg=(total/a.length).toFixed(2);

let max=Math.max(...a);

let min=Math.min(...a);

let out=document.getElementById("output");

out.style.display="block";

out.innerHTML="<h3>Result</h3>"+
"Total Attendance : "+total+
"<br>Average Attendance : "+avg+
"<br>Highest Attendance : "+max+
"<br>Lowest Attendance : "+min;

}

function showCalc(){

let a=values();

let txt="Quarterly Attendance Calculation\n\n";

let total=0;

for(let i=0;i<a.length;i++){

txt+="Value "+(i+1)+" = "+a[i]+"\n";

total+=a[i];

}

txt+="\nTotal = "+total;

txt+="\nAverage = "+(total/a.length).toFixed(2);

document.getElementById("output").style.display="block";

document.getElementById("output").innerText=txt;

}

function showEssbase(){

let txt=`FIX("Actual","FY26","Attendance")

"Year Total" =
QRT1 + QRT2 + QRT3 + QRT4;

"Grand Total" =
@SUM("Year Total");

ENDFIX`;

document.getElementById("output").style.display="block";

document.getElementById("output").innerText=txt;

}

function exportExcel(){

let csv="Attendance\n";

document.querySelectorAll("input").forEach(function(x){

csv+=x.value+"\\n";

});

let blob=new Blob([csv],{type:"text/csv"});

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download="QuarterlyAttendance.csv";

a.click();

}

</script>
