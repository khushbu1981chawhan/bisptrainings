<h2 align="center">Moving Average Simulator</h2>

<table>

<tr>
<th>Month</th>
<th>Income</th>
</tr>

<script>
const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const defaults=[32000,36000,34000,35000,36000,37500,42000,36000,40000,41000,39000,40000];

for(let i=0;i<12;i++){
document.write("<tr><td>"+months[i]+"</td><td><input value='"+defaults[i]+"'></td></tr>");
}
</script>

</table>

<br>

<select id="period">
<option value="3">3 Month Moving Average</option>
<option value="5">5 Month Moving Average</option>
</select>

<br><br>

<button onclick="calculate()">Calculate</button>

<button onclick="showCalculation()">Show Calculation</button>

<button onclick="showEssbase()">Essbase Calculation</button>

<button onclick="exportCSV()">Export Excel</button>

<button onclick="resetPage()">Reset</button>

<button onclick="window.open('https://sonalji2022.github.io/BISP-Trainings/EPM%20Skills%20Assessment.html')">
EPM Skills Assessment
</button>

<button onclick="window.open('https://sonalji2022.github.io/BISP-Trainings/BISP_FCCS_Oracle%20Certification%20Practice.html')">
FCCS Practice
</button>

<div id="output"></div>

<canvas id="chart"></canvas>

</div>

<script>

let chart;

function getData(){

let arr=[];

document.querySelectorAll("input").forEach(x=>arr.push(Number(x.value)));

return arr;

}

function calculate(){

let income=getData();

let n=parseInt(document.getElementById("period").value);

let ma=[];

let txt="Moving Average Results\n\n";

for(let i=0;i<income.length;i++){

if(i<n-1){

ma.push(null);

}else{

let sum=0;

for(let j=i-n+1;j<=i;j++) sum+=income[j];

let avg=sum/n;

ma.push(avg);

txt+=months[i]+" = "+avg.toFixed(2)+"\n";

}

}

document.getElementById("output").innerText=txt;

drawChart(income,ma,n);

}

function drawChart(income,ma,n){

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{

type:'line',

data:{

labels:months,

datasets:[

{

label:'Income',

data:income,

borderWidth:2

},

{

label:n+' Month MA',

data:ma,

borderWidth:2

}

]

}

});

}

function showCalculation(){

let d=getData();

let n=parseInt(document.getElementById("period").value);

let s=0;

let txt="Example\n\n(";

for(let i=0;i<n;i++){

s+=d[i];

txt+=d[i];

if(i<n-1) txt+=" + ";

}

txt+=") / "+n+" = "+(s/n).toFixed(2);

document.getElementById("output").innerText=txt;

}

function showEssbase(){

document.getElementById("output").innerText=

`FIX("Actual","FY26")

"Moving Average"=
(@SUM(Jan:Mar))/3;

ENDFIX`;

}

function exportCSV(){

let csv="Month,Income\n";

let d=getData();

for(let i=0;i<12;i++){

csv+=months[i]+","+d[i]+"\\n";

}

let blob=new Blob([csv]);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="MovingAverage.csv";

a.click();

}

function resetPage(){

location.reload();

}

</script>
