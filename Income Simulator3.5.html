<script>

function getValues(){
let vals=[];
document.querySelectorAll("input").forEach(x=>vals.push(Number(x.value)));
return vals;
}

function calculate(){

let a=getValues();

let total=a.reduce((x,y)=>x+y,0);

let avg=total/a.length;

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=
"<h3>Total Income : "+total.toFixed(2)+"</h3>"+
"<h3>Average Income : "+avg.toFixed(2)+"</h3>";

}

function showCalculation(){

let a=getValues();

let total=a.reduce((x,y)=>x+y,0);

let avg=total/a.length;

document.getElementById("calc").style.display="block";

document.getElementById("calc").innerHTML=
"<b>Total Income</b><br>"+a.join(" + ")+"<br><br>"+
"<b>Total = </b>"+total.toFixed(2)+
"<br><br><b>Average = </b>"+total.toFixed(2)+" / 12 = "+avg.toFixed(2);

}

function showEssbase(){

document.getElementById("essbase").style.display="block";

document.getElementById("essbase").innerHTML=
"<pre>SET UPDATECALC OFF;\n\nFIX(\"Budget\",\"FY26\")\n\n\"Total Income\"=@SUM(Jan:Dec);\n\nENDFIX</pre>";

}

function exportExcel(){

let table=document.querySelector("table").outerHTML;

let url='data:application/vnd.ms-excel,'+encodeURIComponent(table);

let a=document.createElement("a");

a.href=url;

a.download="IncomeSimulator.xls";

a.click();

}

</script>
