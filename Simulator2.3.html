<script>

function getValues(){

let arr=[];

document.querySelectorAll("input").forEach(function(x){

arr.push(Number(x.value));

});

return arr;

}

function calculate(){

let a=getValues();

let total=a.reduce((x,y)=>x+y,0);

let avg=(total/a.length).toFixed(2);

let max=Math.max(...a);

let min=Math.min(...a);

let d=document.getElementById("result");

d.style.display="block";

d.innerHTML="<h3>Calculation Result</h3>"+
"Grand Total : "+total+
"<br>Average : "+avg+
"<br>Highest : "+max+
"<br>Lowest : "+min;

}

function showCalculation(){

let a=getValues();

let txt="Monthly Income Calculation\n\n";

let total=0;

for(let i=0;i<a.length;i++){

txt+="Value "+(i+1)+" = "+a[i]+"\n";

total+=a[i];

}

txt+="\nGrand Total = "+total;

txt+="\nAverage = "+(total/a.length).toFixed(2);

let d=document.getElementById("result");

d.style.display="block";

d.innerText=txt;

}

function showEssbase(){

let txt=`FIX("Actual","FY26","Income")

"Year1 Total"=
Jan+Feb+Mar+Apr+May+Jun+
Jul+Aug+Sep+Oct+Nov+Dec;

"Year2 Total"=
Jan2+Feb2+Mar2+Apr2+May2+Jun2+
Jul2+Aug2+Sep2+Oct2+Nov2+Dec2;

"Grand Total"=
"Year1 Total"+"Year2 Total";

"Average"="Grand Total"/24;

ENDFIX`;

let d=document.getElementById("result");

d.style.display="block";

d.innerText=txt;

}

function exportExcel(){

let csv="Income\n";

document.querySelectorAll("input").forEach(function(x){

csv+=x.value+"\n";

});

let blob=new Blob([csv],{type:"text/csv"});

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download="MonthlyIncome24Months.csv";

a.click();

}

</script>
