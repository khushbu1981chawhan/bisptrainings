<p>
Enter three months of income and calculate the proportional weighted moving average.
</p>

<table>

<tr>
<th>Month</th>
<th>Income</th>
<th>Weight</th>
</tr>

<tr>
<td>January</td>
<td><input id="jan" value="32000"></td>
<td>0.20</td>
</tr>

<tr>
<td>February</td>
<td><input id="feb" value="36000"></td>
<td>0.30</td>
</tr>

<tr>
<td>March</td>
<td><input id="mar" value="34000"></td>
<td>0.50</td>
</tr>

</table>

<br>

<button onclick="calculate()">Calculate</button>

<button onclick="showCalculation()">Show Calculation</button>

<button onclick="showEssbase()">Essbase Calculation</button>

<button onclick="exportExcel()">Export to Excel</button>

<button onclick="resetForm()">Reset</button>

<br><br>

<a class="linkbtn"
target="_blank"
href="https://sonalji2022.github.io/BISP-Trainings/EPM%20Skills%20Assessment.html">
EPM Skills Assessment
</a>



<div id="result" class="output"></div>

<div id="calc" class="output"></div>

<div id="essbase" class="output"></div>

</div>

<script>

function calculate(){

let jan=parseFloat(document.getElementById("jan").value)||0;
let feb=parseFloat(document.getElementById("feb").value)||0;
let mar=parseFloat(document.getElementById("mar").value)||0;

let avg=(jan*0.2)+(feb*0.3)+(mar*0.5);

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=
"<h3>Weighted Moving Average</h3><h2>"+avg.toFixed(2)+"</h2>";

}

function showCalculation(){

let jan=parseFloat(document.getElementById("jan").value)||0;
let feb=parseFloat(document.getElementById("feb").value)||0;
let mar=parseFloat(document.getElementById("mar").value)||0;

let avg=(jan*0.2)+(feb*0.3)+(mar*0.5);

document.getElementById("calc").style.display="block";

document.getElementById("calc").innerHTML=
"<h3>Calculation</h3>" +
"<pre>("+jan+" × 0.20) + ("+feb+" × 0.30) + ("+mar+" × 0.50)\n\n= "+avg.toFixed(2)+"</pre>";

}

function showEssbase(){

document.getElementById("essbase").style.display="block";

document.getElementById("essbase").innerHTML=

"<h3>Essbase Calculation</h3><pre>" +

"SET UPDATECALC OFF;\n\n" +

"FIX(\"Budget\",\"FY26\")\n\n" +

"\"3 Month Weighted Average\"=\n" +

"(\"Jan\"*0.2)+\n" +

"(\"Feb\"*0.3)+\n" +

"(\"Mar\"*0.5);\n\n" +

"ENDFIX" +

"</pre>";

}

function exportExcel(){

let table=document.querySelector("table").outerHTML;

let data='data:application/vnd.ms-excel,'+encodeURIComponent(table);

let a=document.createElement("a");

a.href=data;

a.download="WeightedMovingAverage.xls";

a.click();

}

function resetForm(){

document.getElementById("jan").value=32000;
document.getElementById("feb").value=36000;
document.getElementById("mar").value=34000;

document.getElementById("result").style.display="none";
document.getElementById("calc").style.display="none";
document.getElementById("essbase").style.display="none";

}

</script>
