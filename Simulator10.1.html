<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Multi Sheet Planning Simulator</title>
<style>
body{
    font-family:Arial;
    background:#eef3f8;
    margin:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h2{
    text-align:center;
    color:#003366;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#003366;
    color:white;
    padding:8px;
}

td{
    border:1px solid #ccc;
    padding:6px;
}

input{
    width:100%;
    border:none;
    padding:4px;
}

.section{
    background:#d9edf7;
    font-weight:bold;
}

.buttons{
    text-align:center;
    margin-top:20px;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.calc{
    background:#28a745;
}

.essbase{
    background:#6f42c1;
}

.export{
    background:#007bff;
}

.reset{
    background:#dc3545;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#ffffdd;
    border:1px solid #ccc;
    display:none;
}

</style>
</head>
<body>
<div class="container"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px"><div><img src="BISP logo(21).png" style="height:60px"/></div><div style="font-size:28px;font-weight:bold;color:#003366">BISP Training</div><div style="text-align:right">Mobile: +91 7694095404<br/>www.bisptraining.com</div></div>
<h2>Multi Sheet Planning Simulator</h2>
<table>
<tr class="section">
<td colspan="5">Profit and Loss Account</td>
</tr>
<tr>
<th>Item</th>
<th>Opening</th>
<th>Growth %</th>
<th>Open Prop</th>
<th>Base Variable</th>
</tr>
<tr>
<td>Sales</td>
<td><input id="sales" value="6000"/></td>
<td><input id="growth" value="3"/></td>
<td></td>
<td></td>
</tr>
<tr>
<td>Materials</td>
<td><input value="4"/></td>
<td><input value="2"/></td>
<td></td>
<td></td>
</tr>
<tr>
<td>Labour</td>
<td><input value="10000"/></td>
<td><input value="1.5"/></td>
<td></td>
<td></td>
</tr>
<tr>
<td>Energy</td>
<td><input value="8000"/></td>
<td><input value="2"/></td>
<td></td>
<td></td>
</tr>
<tr class="section">
<td colspan="5">Balance Sheet</td>
</tr>
<tr>
<th>Assets</th>
<th>Opening</th>
<th colspan="3"></th>
</tr>
<tr>
<td>Land &amp; Building</td>
<td><input value="45000"/></td>
<td colspan="3"></td>
</tr>
<tr>
<td>Plant &amp; Equipment</td>
<td><input value="26500"/></td>
<td colspan="3"></td>
</tr>
<tr>
<td>Motor Vehicles</td>
<td><input value="7500"/></td>
<td colspan="3"></td>
</tr>
<tr>
<td>Inventory</td>
<td><input value="39500"/></td>
<td colspan="3"></td>
</tr>
</table>
<div class="buttons">
<button class="calc" onclick="showCalc()">
Show Calculation
</button>
<button class="essbase" onclick="showEssbase()">
Essbase Calculation
</button>
<button class="export" onclick="exportTable()">
Export to Excel
</button>
<button class="reset" onclick="location.reload()">
Reset
</button>
</div>
<div id="result"></div>
</div>
<script>

function showCalc(){

let sales=parseFloat(document.getElementById("sales").value);

let growth=parseFloat(document.getElementById("growth").value);

let forecast=sales+(sales*growth/100);

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=

"<h3>Calculation</h3>" +

"Opening Sales : "+sales+"<br><br>"+

"Growth : "+growth+" %<br><br>"+

"<b>Forecast Sales = "+forecast.toFixed(2)+"</b>";

}

function showEssbase(){

let sales=parseFloat(document.getElementById("sales").value);

let growth=parseFloat(document.getElementById("growth").value);

let formula=

"Essbase Formula<br><br>"+

"Forecast = Sales * (1 + Growth/100)<br><br>"+

sales+" × (1 + "+growth+"/100) = "+

(sales*(1+growth/100)).toFixed(2);

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=formula;

}

function exportTable(){

let table=document.querySelector("table").outerHTML;

let data='application/vnd.ms-excel,'+encodeURIComponent(table);

let link=document.createElement('a');

link.href='data:'+data;

link.download='MultiSheetPlanning.xls';

link.click();

}

</script>
</body>
</html>
